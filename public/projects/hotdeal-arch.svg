<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380">
  <defs>
    <marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,0 10,3 0,6" fill="#475569"/>
    </marker>
  </defs>
  <rect width="860" height="380" fill="#0d0d0d"/>
  <text x="430" y="26" font-family="system-ui,sans-serif" font-size="11" fill="#334155" text-anchor="middle" letter-spacing="3">핫딜 자동화 · END-TO-END PIPELINE ARCHITECTURE</text>

  <!-- Row 1 (top flow): 파트너사 → 스코어링 → 선별 → Shopby 등록 -->

  <!-- 파트너사 신청 -->
  <rect x="20" y="60" width="160" height="54" rx="6" fill="#0f1829" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="100" y="82" font-family="system-ui,sans-serif" font-size="11" fill="#93c5fd" font-weight="600" text-anchor="middle">파트너사 신청</text>
  <text x="100" y="98" font-family="system-ui,sans-serif" font-size="9" fill="#475569" text-anchor="middle">상품 정보 제출</text>
  <line x1="180" y1="87" x2="218" y2="87" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 스코어링 엔진 -->
  <rect x="220" y="60" width="180" height="54" rx="6" fill="#1c1400" stroke="#854d0e" stroke-width="1.5"/>
  <text x="310" y="80" font-family="system-ui,sans-serif" font-size="11" fill="#fbbf24" font-weight="600" text-anchor="middle">랭킹 알고리즘</text>
  <text x="310" y="96" font-family="system-ui,sans-serif" font-size="9" fill="#475569" text-anchor="middle">할인율 · 가격 경쟁력 · 재고</text>
  <text x="310" y="108" font-family="system-ui,sans-serif" font-size="9" fill="#475569" text-anchor="middle">가중치 스코어링</text>
  <line x1="400" y1="87" x2="438" y2="87" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 상위 200 선별 -->
  <rect x="440" y="60" width="160" height="54" rx="6" fill="#1c1400" stroke="#854d0e" stroke-width="1.5"/>
  <text x="520" y="82" font-family="system-ui,sans-serif" font-size="11" fill="#fbbf24" font-weight="600" text-anchor="middle">상위 200 선별</text>
  <text x="520" y="98" font-family="system-ui,sans-serif" font-size="9" fill="#475569" text-anchor="middle">점수 기준 자동 필터링</text>
  <line x1="600" y1="87" x2="638" y2="87" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Shopby API 등록 -->
  <rect x="640" y="60" width="200" height="54" rx="6" fill="#0a1a0a" stroke="#166534" stroke-width="1.5"/>
  <text x="740" y="82" font-family="system-ui,sans-serif" font-size="11" fill="#4ade80" font-weight="600" text-anchor="middle">Shopby API 등록</text>
  <text x="740" y="98" font-family="system-ui,sans-serif" font-size="9" fill="#475569" text-anchor="middle">상품 자동 등록</text>

  <!-- Arrow down from Shopby to cron -->
  <line x1="740" y1="114" x2="740" y2="172" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Row 2 (bottom flow, right to left): cron 오픈 → OAuth 메일 → BigQuery -->

  <!-- cron 오픈 -->
  <rect x="640" y="174" width="200" height="54" rx="6" fill="#0a1a0a" stroke="#166534" stroke-width="1.5"/>
  <text x="740" y="196" font-family="system-ui,sans-serif" font-size="11" fill="#4ade80" font-weight="600" text-anchor="middle">cron 스케줄러</text>
  <text x="740" y="212" font-family="system-ui,sans-serif" font-size="9" fill="#475569" text-anchor="middle">새벽 시간 자동 오픈 실행</text>
  <line x1="640" y1="201" x2="602" y2="201" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- OAuth 메일 발송 -->
  <rect x="400" y="174" width="200" height="54" rx="6" fill="#1c1400" stroke="#854d0e" stroke-width="1.5"/>
  <text x="500" y="196" font-family="system-ui,sans-serif" font-size="11" fill="#fbbf24" font-weight="600" text-anchor="middle">OAuth 2.0 메일 발송</text>
  <text x="500" y="212" font-family="system-ui,sans-serif" font-size="9" fill="#475569" text-anchor="middle">파트너사별 결과 자동 발송</text>
  <line x1="400" y1="201" x2="362" y2="201" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- BigQuery -->
  <rect x="160" y="174" width="200" height="54" rx="6" fill="#140820" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="260" y="196" font-family="system-ui,sans-serif" font-size="11" fill="#c4b5fd" font-weight="600" text-anchor="middle">BigQuery</text>
  <text x="260" y="212" font-family="system-ui,sans-serif" font-size="9" fill="#475569" text-anchor="middle">핫딜 등록 · 오픈 이력 적재</text>

  <!-- CI/CD section -->
  <line x1="430" y1="260" x2="430" y2="260"/>
  <text x="430" y="278" font-family="system-ui,sans-serif" font-size="9" fill="#1e293b" text-anchor="middle" letter-spacing="2">── CI/CD PIPELINE ──</text>

  <!-- Bitbucket Pipelines -->
  <rect x="180" y="290" width="220" height="54" rx="6" fill="#0f1829" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="290" y="312" font-family="system-ui,sans-serif" font-size="11" fill="#93c5fd" font-weight="600" text-anchor="middle">Bitbucket Pipelines</text>
  <text x="290" y="328" font-family="system-ui,sans-serif" font-size="9" fill="#475569" text-anchor="middle">push → 테스트 → 빌드 자동화</text>
  <line x1="400" y1="317" x2="438" y2="317" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- AWS EC2 -->
  <rect x="440" y="290" width="220" height="54" rx="6" fill="#0a1a0a" stroke="#166534" stroke-width="1.5"/>
  <text x="550" y="312" font-family="system-ui,sans-serif" font-size="11" fill="#4ade80" font-weight="600" text-anchor="middle">AWS EC2</text>
  <text x="550" y="328" font-family="system-ui,sans-serif" font-size="9" fill="#475569" text-anchor="middle">배포 · 운영 환경 (dev / prod 분리)</text>
</svg>
