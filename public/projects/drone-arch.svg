  <text x="110" y="358" font-family="system-ui,sans-serif" font-size="9" fill="#475569" text-anchor="middle">mAP 61% → 75%</text>
  <line x1="200" y1="335" x2="430" y2="175" stroke="#7c2d12" stroke-width="1" stroke-dasharray="4,2"/>
