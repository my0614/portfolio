<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <marker id="a" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,0 10,3 0,6" fill="#475569"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#0d0d0d"/>
  <text x="400" y="26" font-family="system-ui,sans-serif" font-size="11" fill="#334155" text-anchor="middle" letter-spacing="3">DFLOW · MLOPS PLATFORM ARCHITECTURE</text>

  <!-- Web UI -->
  <rect x="300" y="42" width="200" height="46" rx="6" fill="#0f1829" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="400" y="62" font-family="system-ui,sans-serif" font-size="12" fill="#93c5fd" font-weight="600" text-anchor="middle">Web UI</text>
  <text x="400" y="78" font-family="system-ui,sans-serif" font-size="10" fill="#475569" text-anchor="middle">학습 요청 · 진행 상태 조회</text>
  <line x1="400" y1="88" x2="400" y2="106" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- API Server -->
  <rect x="285" y="108" width="230" height="46" rx="6" fill="#0f1829" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="400" y="128" font-family="system-ui,sans-serif" font-size="12" fill="#93c5fd" font-weight="600" text-anchor="middle">API Server</text>
  <text x="400" y="144" font-family="system-ui,sans-serif" font-size="10" fill="#475569" text-anchor="middle">job 등록 · 상태 조회 · 결과 반환</text>
  <line x1="400" y1="154" x2="400" y2="172" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Redis Queue -->
  <rect x="160" y="174" width="480" height="50" rx="6" fill="#1c1400" stroke="#854d0e" stroke-width="1.5"/>
  <text x="400" y="195" font-family="system-ui,sans-serif" font-size="12" fill="#fbbf24" font-weight="600" text-anchor="middle">Redis Queue</text>
  <text x="400" y="212" font-family="system-ui,sans-serif" font-size="10" fill="#475569" text-anchor="middle">BRPOP 원자적 분배 · Hash로 상태 / GPU 번호 / 에러 로그 중앙 관리</text>

  <!-- K8s label -->
  <text x="400" y="248" font-family="system-ui,sans-serif" font-size="9" fill="#1e293b" text-anchor="middle" letter-spacing="2">── K8s POD SCALING ──</text>

  <!-- Arrows to Workers -->
  <line x1="290" y1="224" x2="160" y2="272" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="400" y1="224" x2="400" y2="272" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="510" y1="224" x2="640" y2="272" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Worker Pod 1 -->
  <rect x="55" y="274" width="210" height="68" rx="6" fill="#081208" stroke="#166534" stroke-width="1.5"/>
  <text x="160" y="294" font-family="system-ui,sans-serif" font-size="11" fill="#4ade80" font-weight="600" text-anchor="middle">Worker Pod</text>
  <text x="160" y="310" font-family="system-ui,sans-serif" font-size="9" fill="#475569" text-anchor="middle">nvidia-smi 가용 메모리 체크</text>
  <text x="160" y="324" font-family="system-ui,sans-serif" font-size="9" fill="#475569" text-anchor="middle">GPU 할당 → MMDetection 학습</text>
  <text x="160" y="338" font-family="system-ui,sans-serif" font-size="9" fill="#1e293b" text-anchor="middle">메모리 부족 시 재큐잉</text>

  <!-- Worker Pod 2 -->
  <rect x="295" y="274" width="210" height="68" rx="6" fill="#081208" stroke="#166534" stroke-width="1.5"/>
  <text x="400" y="294" font-family="system-ui,sans-serif" font-size="11" fill="#4ade80" font-weight="600" text-anchor="middle">Worker Pod</text>
  <text x="400" y="310" font-family="system-ui,sans-serif" font-size="9" fill="#475569" text-anchor="middle">nvidia-smi 가용 메모리 체크</text>
  <text x="400" y="324" font-family="system-ui,sans-serif" font-size="9" fill="#475569" text-anchor="middle">GPU 할당 → MMDetection 학습</text>
  <text x="400" y="338" font-family="system-ui,sans-serif" font-size="9" fill="#1e293b" text-anchor="middle">메모리 부족 시 재큐잉</text>

  <!-- Worker Pod N -->
  <rect x="535" y="274" width="210" height="68" rx="6" fill="#081208" stroke="#166534" stroke-width="1.5"/>
  <text x="640" y="294" font-family="system-ui,sans-serif" font-size="11" fill="#4ade80" font-weight="600" text-anchor="middle">Worker Pod N</text>
  <text x="640" y="310" font-family="system-ui,sans-serif" font-size="9" fill="#475569" text-anchor="middle">nvidia-smi 가용 메모리 체크</text>
  <text x="640" y="324" font-family="system-ui,sans-serif" font-size="9" fill="#475569" text-anchor="middle">GPU 할당 → MMDetection 학습</text>
  <text x="640" y="338" font-family="system-ui,sans-serif" font-size="9" fill="#1e293b" text-anchor="middle">메모리 부족 시 재큐잉</text>

  <!-- Arrows to PostgreSQL -->
  <line x1="160" y1="342" x2="300" y2="388" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="400" y1="342" x2="400" y2="388" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="640" y1="342" x2="500" y2="388" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- PostgreSQL -->
  <rect x="160" y="390" width="480" height="40" rx="6" fill="#140820" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="400" y="408" font-family="system-ui,sans-serif" font-size="12" fill="#c4b5fd" font-weight="600" text-anchor="middle">PostgreSQL</text>
  <text x="400" y="422" font-family="system-ui,sans-serif" font-size="10" fill="#475569" text-anchor="middle">학습 결과 · 모델 성능 지표 · job 이력 저장</text>
</svg>
